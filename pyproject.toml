[project]
name = "wb-pipeline"
version = "0.1.0"
description = "Config-driven World Bank indicators pipeline (Python + DuckDB + dbt + Dagster)"
authors = [
    { name = "Bruno Andrade Santos" }
]
requires-python = ">=3.12"
dependencies = [
    "dagster>=1.13.30",
    "dagster-dbt>=0.29.30",
    "dagster-webserver>=1.13.30",
    "dbt-duckdb>=1.11.1",
    "duckdb>=2.0.0",
    "pyyaml>=6.0.3",
    "requests>=2.34.2",
]

[project.scripts]
wb = "wb_pipeline.cli:main"

[build-system]
requires = ["uv_build>=0.11.26,<0.12.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.2.0",
    "responses>=0.26.3",
]

[tool.dagster]
module_name = "wb_pipeline.orchestration"
